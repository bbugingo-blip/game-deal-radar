# /etc/nginx/sites-available/game-deal-radar-lb  (Lb01)
# Replace WEB01_IP and WEB02_IP with the servers' addresses.
upstream game_deal_radar_backend {
    # round-robin (default). A server is skipped for 10s after 3 failures.
    server WEB01_IP:80 max_fails=3 fail_timeout=10s;
    server WEB02_IP:80 max_fails=3 fail_timeout=10s;
}

server {
    listen 80 default_server;
    server_name _;

    location / {
        proxy_pass http://game_deal_radar_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_connect_timeout 3s;

        # Shows which backend answered (handy for the demo video).
        add_header X-Upstream $upstream_addr always;
    }
}
