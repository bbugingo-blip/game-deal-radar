# Load balancer (7257-lb-01): relevant part of /etc/haproxy/haproxy.cfg
# The `global` and `defaults` sections are the stock Ubuntu ones.

frontend http-in
    bind *:80
    mode http
    default_backend web_servers

backend web_servers
    mode http
    balance roundrobin
    server 7257-web-01 18.132.43.17:80 check
    server 7257-web-02 35.178.171.98:80 check
